<svg width="560" height="560" viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1b3860" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1D33" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#5b7aa6" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="globe"><circle cx="280" cy="280" r="210"/></clipPath>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E4C877"/><stop offset="1" stop-color="#C79A4A"/>
    </linearGradient>
  </defs>

  <circle cx="280" cy="280" r="240" fill="url(#glow)"/>
  <!-- dotted sphere -->
  <g clip-path="url(#globe)">
    <rect x="70" y="70" width="420" height="420" fill="url(#dots)"/>
  </g>
  <circle cx="280" cy="280" r="210" stroke="#5b7aa6" stroke-opacity="0.35" stroke-width="1"/>
  <!-- meridians / latitudes -->
  <g stroke="#5b7aa6" stroke-opacity="0.28" fill="none" stroke-width="1">
    <ellipse cx="280" cy="280" rx="90" ry="210"/>
    <ellipse cx="280" cy="280" rx="165" ry="210"/>
    <line x1="70" y1="280" x2="490" y2="280"/>
    <path d="M92 200 Q280 165 468 200"/>
    <path d="M92 360 Q280 395 468 360"/>
  </g>
  <!-- gold connection arcs -->
  <g stroke="url(#arc)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M180 210 Q300 120 380 200" opacity="0.95"/>
    <path d="M200 360 Q330 420 400 330" opacity="0.85"/>
    <path d="M175 290 Q260 250 395 265" opacity="0.7"/>
  </g>
  <!-- region markers -->
  <g fill="#E4C877">
    <circle cx="180" cy="210" r="5"/><circle cx="180" cy="210" r="11" fill="#E4C877" fill-opacity="0.18"/>
    <circle cx="380" cy="200" r="5"/><circle cx="380" cy="200" r="11" fill="#E4C877" fill-opacity="0.18"/>
    <circle cx="200" cy="360" r="5"/><circle cx="200" cy="360" r="11" fill="#E4C877" fill-opacity="0.18"/>
    <circle cx="400" cy="330" r="5"/><circle cx="400" cy="330" r="11" fill="#E4C877" fill-opacity="0.18"/>
  </g>
</svg>
